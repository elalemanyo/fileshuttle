name: FileShuttle
options:
  bundleIdPrefix: de.elalemanyo
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  ShuttleKit:
    path: Packages/ShuttleKit
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  FileShuttle:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: ShuttleKit
      - package: KeyboardShortcuts
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FileShuttle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Any File
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes: [public.item, public.folder]
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Drop files in the menu bar, get a link."
        # Sparkle: the appcast is attached to every GitHub release by the release workflow.
        SUFeedURL: https://github.com/elalemanyo/fileshuttle/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
    entitlements:
      path: App/FileShuttle.entitlements
      properties:
        # Ad-hoc signatures have no Team ID, so the hardened runtime's library validation would refuse
        # to load the embedded Sparkle.framework. Needed until we sign with a Developer ID.
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.elalemanyo.FileShuttle
        PRODUCT_NAME: FileShuttle
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        DEAD_CODE_STRIPPING: YES
        # Sparkle stays disabled without a public key, so Debug builds from Xcode never check for updates.
        SPARKLE_PUBLIC_KEY: ""
      configs:
        Release:
          # Public half of the Sparkle signing key; CI signs updates with the private half
          # (SPARKLE_PRIVATE_KEY secret, see scripts/make-appcast.sh).
          SPARKLE_PUBLIC_KEY: EE83FbrLIVz0s94n4Mav5DnmZZ4aFA/9FACzeY2sKlg=
